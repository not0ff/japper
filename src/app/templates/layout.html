<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Japper: {% block page_title %} {% endblock %}</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/style.css') }}"
        />
        <link
            rel="icon"
            href="{{ url_for('static', filename='images/favicon.png') }}"
            type="image/x-icon"
        />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body class="bg-dark-subtle fredoka-text">
        <nav
            class="navbar navbar-expand-lg bg-dark navbar-dark border-bottom border-dark-subtle"
        >
            <div class="container-fluid">
                <a href="#" class="navbar-brand ms-1">
                    <img
                        src="{{ url_for('static', filename='images/favicon.png') }}"
                        alt="Logo"
                        width="32"
                        height="32"
                        class="d-inline-block align-text-top mx-1"
                    />
                    <span class="h4 chango-text">Japper</span>
                </a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div
                    class="collapse navbar-collapse"
                    id="navbarSupportedContent"
                >
                    <ul
                        class="navbar-nav ms-auto me-2 my-1 d-flex flex-row gap-3"
                    >
                        {% if session['logged'] %}
                        <li class="nav-item">
                            <a
                                href="{{ url_for('core.feed') }}"
                                class="nav-link fw-semibold"
                                >Feed</a
                            >
                        </li>
                        <li class="nav-item">
                            <a
                                href="{{ url_for('core.newest') }}"
                                class="nav-link fw-semibold"
                                >Newest</a
                            >
                        </li>
                        <li class="nav-item">
                            <a
                                href="{{ url_for('core.search') }}"
                                class="nav-link fw-semibold"
                                >Search</a
                            >
                        </li>
                        <li class="nav-item">
                            <a
                                href="{{ url_for('core.profile') }}"
                                class="nav-link fw-semibold"
                                >Profile</a
                            >
                        </li>
                        <li class="nav-item">
                            <a
                                href="{{ url_for('auth.logout') }}"
                                class="nav-link fw-semibold"
                                >Logout</a
                            >
                        </li>
                        {% else %}
                        <li class="nav-item">
                            <a
                                href="{{ url_for('auth.login') }}"
                                class="nav-link fw-semibold"
                                >Login</a
                            >
                        </li>
                        <li class="nav-item">
                            <a
                                href="{{ url_for('auth.signup') }}"
                                class="nav-link fw-semibold"
                                >Sign Up</a
                            >
                        </li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </nav>
        <main
            class="container-flex d-flex flex-column justify-content-evenly align-items-center"
        >
            {% block main %} {% endblock %}
        </main>
        <script>
            let url = window.location.href;
            let navbarLinks = document.querySelectorAll(
                "ul.navbar-nav a.nav-link"
            );

            navbarLinks.forEach(function (link) {
                if (link.href === url) {
                    link.classList.add("active");
                }
            });
        </script>
        {% block script %}{% endblock %}
    </body>
</html>
