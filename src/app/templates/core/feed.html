{% extends "layout.html" %}

{% block page_title %}
    {{ feed_title }}
{% endblock %}

{% block main %}
    <p class="h2 text-body-secondary">{{ feed_title }}</p>
    {% if posts|list %}
        {% for post in posts %}
            {% include "post/post.html" %}
        {% endfor %}
    {% else %}
    <p class="fs-5 mt-5">Nothing in here yet!</p>
    {% endif %}
{% endblock %}
